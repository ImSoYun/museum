<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- round06f 갈래 F — Maze UT 스니펫(공식 가이드 원문 + 가드 2줄, spec §11.2.1).
         위치가 계약이다: charset·viewport 메타 뒤, 제목 요소 앞. 인코딩 선언은 문서 첫
         1024바이트 안에서 끝나야 하는데(HTML 표준), prod nginx에 charset 지시어가 없어
         (web/nginx.conf·nginx/nginx.conf grep 0건 → 기본 charset off) 이 선언이 한국어
         제목의 유일한 인코딩 근거다. head 바로 뒤에 넣으면 이 스니펫 976바이트가 그 앞을
         채워 선언 끝이 1046바이트로 밀린다(실측) — "가능한 한 위"라는 Maze 권고는 두 줄
         뒤에서도 충분히 지켜진다.
         type="module"을 붙이지 않는다 — 클래식 인라인이라야 Vite가 JS 번들로 뽑아내지
         않고 dist/index.html에 그대로 남는다. 배포 검증이 서빙 HTML을 보는 이유다(§11.4-5).
         키는 빌드타임 주입이다: dev=Vercel 프로젝트 환경변수 / prod=compose build args →
         Dockerfile ARG·ENV. 미주입이면 아래 가드가 no-op으로 만든다(§11.5, 로컬 무해). -->
    <script>
(function (m, a, z, e) {
  // round06f 가드 — 키가 주입되지 않으면 no-op. Vite의 HTML env 치환은 값이 없으면
  // 퍼센트 기호로 시작하는 플레이스홀더 원문을 그대로 남기므로(htmlEnvHook 실측)
  // 첫 글자가 퍼센트 기호인지로 판별한다. 이 주석에 토큰 자체를 적지 않는 이유는
  // htmlEnvHook의 치환이 정규식 전역이라 주석 안의 토큰까지 키로 바꿔 버리기 때문이다.
  if (!e || e.charAt(0) === '%') return;
  var s, t, u, v;
  try {
    t = m.sessionStorage.getItem('maze-us');
  } catch (err) {}

  if (!t) {
    t = new Date().getTime();
    try {
      m.sessionStorage.setItem('maze-us', t);
    } catch (err) {}
  }

  u = document.currentScript || (function () {
    var w = document.getElementsByTagName('script');
    return w[w.length - 1];
  })();
  v = u && u.nonce;

  s = a.createElement('script');
  s.src = z + '?apiKey=' + e;
  s.async = true;
  if (v) s.setAttribute('nonce', v);
  a.getElementsByTagName('head')[0].appendChild(s);
  m.mazeUniversalSnippetApiKey = e;
})(window, document, 'https://snippet.maze.co/maze-universal-loader.js', '%VITE_MAZE_API_KEY%');
    </script>
    <title>대한민국역사박물관 지능형 학예 지식 플랫폼</title>
    <!-- round06c 리뷰 fix6: /favicon.ico 404 방지 — 별도 자산 파일 없이 인라인 SVG data URI로 처리 -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%232563eb'/%3E%3Ctext x='16' y='23' font-size='19' text-anchor='middle' fill='white' font-family='sans-serif' font-weight='bold'%3EA%3C/text%3E%3C/svg%3E" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
