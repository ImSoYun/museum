# 이 파일의 책임: 앱 노드의 단일 진입점.
#   /      → 빌드된 SPA 정적 파일을 서빙(클라이언트 라우팅은 index.html로 폴백)
#   /api/  → 백엔드(FastAPI)로 리버스 프록시
# 클라우드/사내망 동일. 백엔드 주소만 환경에 맞게 바꾼다(ADR D-03·D-05: 인프라 계층 양쪽 동일).
#
# [포트] 비루트 런타임(nginxinc/nginx-unprivileged)은 1024 미만 특권 포트를 못 연다.
#   그래서 8080 으로 listen 한다. Dockerfile EXPOSE 8080 · compose web expose 8080 ·
#   게이트웨이 upstream(proxy_pass http://web:8080) 과 모두 정합되어야 한다.
server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # [직접접근 폴백] 평상시 /api 는 게이트웨이 nginx(nginx/nginx.conf)가 처리한다.
    #   이 블록은 web 컨테이너에 직접 붙는 디버그/단독 기동 시의 폴백이며, 게이트웨이와
    #   동일하게 /api 접두를 떼고 api:8000 으로 전달해 동작을 일치시킨다(CORS 불필요·동일 출처).
    location /api/ {
        proxy_pass http://api:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA 폴백: 새로고침/딥링크 시 라우트를 index.html로 돌려 클라이언트 라우터가 처리.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
